[project]
name = "km"
version = "0.1.0"
description = "knowledgemaxxing: mine your digital exhaust into organized, searchable knowledge"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
]

[project.optional-dependencies]
scrape = ["playwright>=1.44"]
ai = ["anthropic>=0.34"]
embed = ["sentence-transformers>=3.0", "sqlite-vec>=0.1.6"]
web = ["fastapi>=0.111", "uvicorn>=0.30"]
fetch = ["httpx>=0.27", "trafilatura>=1.9"]

[dependency-groups]
dev = ["pytest>=8.2"]

[project.scripts]
km = "km.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["km"]

[tool.pytest.ini_options]
testpaths = ["tests"]
